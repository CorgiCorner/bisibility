x-temporal-env: &temporal-env
  BISIBILITY_DEPLOYMENT_SUFFIX: ${BISIBILITY_DEPLOYMENT_SUFFIX:-}
  SCHEDULER_DRIVER: temporal
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
  TEMPORAL_ALERT_DELIVERY_TASK_QUEUE: ${TEMPORAL_ALERT_DELIVERY_TASK_QUEUE:-}
  TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-}
  TEMPORAL_SCHEDULE_CATCHUP_WINDOW: ${TEMPORAL_SCHEDULE_CATCHUP_WINDOW:-}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-}
  TEMPORAL_TLS: ${TEMPORAL_TLS:-auto}

services:
  app:
    environment:
      <<: *temporal-env

  worker:
    image: ${BISIBILITY_WORKER_IMAGE:-docker.io/corgicorner/bisibility-worker:0.13.4}
    pull_policy: ${BISIBILITY_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      <<: *temporal-env
      ALERT_DELIVERY_FAILURE_RATE_THRESHOLD: ${ALERT_DELIVERY_FAILURE_RATE_THRESHOLD:-}
      ALERT_DELIVERY_MIN_ATTEMPTS: ${ALERT_DELIVERY_MIN_ATTEMPTS:-}
      ALERT_DELIVERY_SWEEP_ENABLED: ${ALERT_DELIVERY_SWEEP_ENABLED:-}
      ALERT_DELIVERY_SWEEP_INTERVAL: ${ALERT_DELIVERY_SWEEP_INTERVAL:-}
      ALERT_DELIVERY_WINDOW_HOURS: ${ALERT_DELIVERY_WINDOW_HOURS:-}
      ALERT_DIGEST_FLUSH_ENABLED: ${ALERT_DIGEST_FLUSH_ENABLED:-}
      ALERT_DIGEST_FLUSH_INTERVAL: ${ALERT_DIGEST_FLUSH_INTERVAL:-}
      ALERT_FIRE_SPIKE_MIN: ${ALERT_FIRE_SPIKE_MIN:-}
      ALERT_FIRE_SPIKE_MULTIPLIER: ${ALERT_FIRE_SPIKE_MULTIPLIER:-}
      ALERT_HEALTH_INTERVAL: ${ALERT_HEALTH_INTERVAL:-}
      AUDIT_IP_HMAC_SECRET: ${AUDIT_IP_HMAC_SECRET:-}
      AUDIT_PURGE_CRON: ${AUDIT_PURGE_CRON:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_DATAFORSEO_PER_MINUTE: ${BISIBILITY_PROVIDER_RATE_LIMIT_DATAFORSEO_PER_MINUTE:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_DATAFORSEO_WINDOW_SECONDS: ${BISIBILITY_PROVIDER_RATE_LIMIT_DATAFORSEO_WINDOW_SECONDS:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_DISABLED: ${BISIBILITY_PROVIDER_RATE_LIMIT_DISABLED:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_GA4_PER_MINUTE: ${BISIBILITY_PROVIDER_RATE_LIMIT_GA4_PER_MINUTE:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_GA4_WINDOW_SECONDS: ${BISIBILITY_PROVIDER_RATE_LIMIT_GA4_WINDOW_SECONDS:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_GSC_PER_MINUTE: ${BISIBILITY_PROVIDER_RATE_LIMIT_GSC_PER_MINUTE:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_GSC_WINDOW_SECONDS: ${BISIBILITY_PROVIDER_RATE_LIMIT_GSC_WINDOW_SECONDS:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_SERPAPI_PER_MINUTE: ${BISIBILITY_PROVIDER_RATE_LIMIT_SERPAPI_PER_MINUTE:-}
      BISIBILITY_PROVIDER_RATE_LIMIT_SERPAPI_WINDOW_SECONDS: ${BISIBILITY_PROVIDER_RATE_LIMIT_SERPAPI_WINDOW_SECONDS:-}
      BISIBILITY_SECRETS_KEY: "${BISIBILITY_SECRETS_KEY:?Set BISIBILITY_SECRETS_KEY in .env}"
      BISIBILITY_SECRETS_KEYS_RETIRED: ${BISIBILITY_SECRETS_KEYS_RETIRED:-}
      DATABASE_APPLICATION_NAME: bisibility-worker
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-10000}
      DATABASE_POOL_MAX: ${BISIBILITY_WORKER_DATABASE_POOL_MAX:-4}
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_QUEUED_RANK_CHECKS_ENABLED: ${DATAFORSEO_QUEUED_RANK_CHECKS_ENABLED:-}
      DATAFORSEO_QUEUE_MAX_AGE_SECONDS: ${DATAFORSEO_QUEUE_MAX_AGE_SECONDS:-}
      DATAFORSEO_QUEUE_POLL_INTERVAL_SECONDS: ${DATAFORSEO_QUEUE_POLL_INTERVAL_SECONDS:-}
      DATAFORSEO_QUEUE_PRIORITY: ${DATAFORSEO_QUEUE_PRIORITY:-}
      DATA_REGION: ${DATA_REGION:-}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-host}
      EMAIL_ALERTS_FROM: ${EMAIL_ALERTS_FROM:-}
      EMAIL_DAILY_BUDGET_BULK: ${EMAIL_DAILY_BUDGET_BULK:-}
      EMAIL_DAILY_BUDGET_TRANSACTIONAL: ${EMAIL_DAILY_BUDGET_TRANSACTIONAL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPS_EVENTS_ENABLED: ${OPS_EVENTS_ENABLED:-}
      OPS_HEARTBEAT_CRON: ${OPS_HEARTBEAT_CRON:-}
      OPS_HEARTBEAT_TZ: ${OPS_HEARTBEAT_TZ:-}
      OPS_NOTIFY_MODE: ${OPS_NOTIFY_MODE:-}
      OPS_SLACK_INCLUDE_NAMES: ${OPS_SLACK_INCLUDE_NAMES:-}
      OPS_SLACK_WEBHOOK_URL: ${OPS_SLACK_WEBHOOK_URL:-}
      OPS_THROTTLE_MINUTES: ${OPS_THROTTLE_MINUTES:-}
      PRESENCE_SYNC_CRON: ${PRESENCE_SYNC_CRON:-}
      PRESENCE_SYNC_ENABLED: ${PRESENCE_SYNC_ENABLED:-}
      QUEUED_RANK_CHECK_RETENTION_CRON: ${QUEUED_RANK_CHECK_RETENTION_CRON:-}
      RANK_CHECK_DISPATCHER_ENABLED: ${RANK_CHECK_DISPATCHER_ENABLED:-}
      RANK_CHECK_DISPATCHER_INTERVAL: ${RANK_CHECK_DISPATCHER_INTERVAL:-}
      RANK_CHECK_DISPATCHER_MAX_KEYWORDS_PER_PROJECT_PER_PASS: ${RANK_CHECK_DISPATCHER_MAX_KEYWORDS_PER_PROJECT_PER_PASS:-25}
      RANK_CHECK_RAW_PROGRESS_FENCE_RETENTION_DAYS: ${RANK_CHECK_RAW_PROGRESS_FENCE_RETENTION_DAYS:-}
      RANK_CHECK_RAW_PURGE_CRON: ${RANK_CHECK_RAW_PURGE_CRON:-}
      RANK_CHECK_RAW_RETENTION_DAYS: ${RANK_CHECK_RAW_RETENTION_DAYS:-}
      RANK_CHECK_RECONCILER_ENABLED: ${RANK_CHECK_RECONCILER_ENABLED:-}
      RANK_CHECK_RECONCILER_INTERVAL: ${RANK_CHECK_RECONCILER_INTERVAL:-}
      RANK_CHECK_SCHEDULER_MODE: ${RANK_CHECK_SCHEDULER_MODE:-}
      REDIS_TLS_CA_B64: ${REDIS_TLS_CA_B64:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SCHEDULED_MAINTENANCE_ENABLED: ${SCHEDULED_MAINTENANCE_ENABLED:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SESSION_PURGE_CRON: ${SESSION_PURGE_CRON:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_REGION: ${SES_REGION:-}
      SITEMAP_SYNC_CRON: ${SITEMAP_SYNC_CRON:-}
      SITEMAP_SYNC_ENABLED: ${SITEMAP_SYNC_ENABLED:-}
      SMTP_URL: ${SMTP_URL:-}
      STALE_CHECKS_INTERVAL: ${STALE_CHECKS_INTERVAL:-}
      TEMPORAL_MAX_CONCURRENT_ACTIVITIES: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-5}
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-}
      TRAFFIC_SNAPSHOT_RETENTION_DAYS: ${TRAFFIC_SNAPSHOT_RETENTION_DAYS:-}
      TRAFFIC_SYNC_CRON: ${TRAFFIC_SYNC_CRON:-}
      TRAFFIC_SYNC_ENABLED: ${TRAFFIC_SYNC_ENABLED:-}
      WEBHOOK_ALLOW_PRIVATE_NETWORK: ${WEBHOOK_ALLOW_PRIVATE_NETWORK:-}
      WEEKLY_DIGEST_CRON: ${WEEKLY_DIGEST_CRON:-}
      WORKER_SCHEMA_GUARD: ${WORKER_SCHEMA_GUARD:-}
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
