name: bisibility-quality

services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9000/api/system/status | grep --quiet '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  scanner:
    image: sonarsource/sonar-scanner-cli:12.1
    profiles:
      - scan
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: "${SONAR_TOKEN:-}"
    volumes:
      - .:/usr/src
      - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache

volumes:
  sonar_scanner_cache:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
