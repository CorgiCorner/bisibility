  args:
    APP_REVISION: ${APP_REVISION:-}
    APP_VERSION: ${APP_VERSION:-}
    CORGICORNER_EPHEMERAL: ${CORGICORNER_EPHEMERAL:-0}
    NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-https://bisibility.com/docs}

x-app-env: &app-env
  ALERT_DELIVERY_FAILURE_RATE_THRESHOLD: ${ALERT_DELIVERY_FAILURE_RATE_THRESHOLD:-}
  ALERT_DELIVERY_MIN_ATTEMPTS: ${ALERT_DELIVERY_MIN_ATTEMPTS:-}
  ALERT_DELIVERY_SWEEP_ENABLED: ${ALERT_DELIVERY_SWEEP_ENABLED:-}
  ALERT_DELIVERY_SWEEP_INTERVAL: ${ALERT_DELIVERY_SWEEP_INTERVAL:-}
  ALERT_DELIVERY_WINDOW_HOURS: ${ALERT_DELIVERY_WINDOW_HOURS:-}
  ALERT_DIGEST_FLUSH_ENABLED: ${ALERT_DIGEST_FLUSH_ENABLED:-}
  ALERT_DIGEST_FLUSH_INTERVAL: ${ALERT_DIGEST_FLUSH_INTERVAL:-}
  ALERT_FIRE_SPIKE_MIN: ${ALERT_FIRE_SPIKE_MIN:-}
  ALERT_FIRE_SPIKE_MULTIPLIER: ${ALERT_FIRE_SPIKE_MULTIPLIER:-}
  ALERT_HEALTH_INTERVAL: ${ALERT_HEALTH_INTERVAL:-}
  AUDIT_IP_HMAC_SECRET: ${AUDIT_IP_HMAC_SECRET:-}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
