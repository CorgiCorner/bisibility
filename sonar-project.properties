sonar.projectKey=corgicorner_bisibility
sonar.projectName=bisibility

# Analyze the repository as contributors receive it. Generated output, vendored
# dependencies, and build artifacts are not product code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.ts,**/*.stories.tsx,tests/**
sonar.exclusions=node_modules/**,.next/**,out/**,build/**,dist/**,coverage/**,storybook-static/**,playwright-report/**,test-results/**,reports/**,graphify-out/**,prisma/generated/**,lib/deployment/runtime-env.generated.ts,docs/openapi.snapshot.json,public/**/*.png,public/**/*.webp,public/**/*.jpg,public/**/*.jpeg,public/**/*.gif,public/**/*.ico

# Only generated files and executable configuration are outside the coverage goal.
# Hand-written application code, scripts, tools, and examples remain measurable.
sonar.coverage.exclusions=**/*.d.ts,**/*.config.ts,**/*.config.js,**/*.config.mjs,next-env.d.ts,lib/deployment/runtime-env.generated.ts
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.ts,**/*.stories.tsx,prisma/migrations/**,lib/deployment/runtime-env.generated.ts

# These local operator scripts intentionally inherit the caller's PATH to resolve
# npm/npx and the active Node toolchain. They do not accept PATH from remote input.
sonar.issue.ignore.multicriteria=localPathE2e,localPathScreenshot,localPathStorybook,localPathSmoke,asyncLocationCombobox,nextStaticMatcher
sonar.issue.ignore.multicriteria.localPathE2e.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.localPathE2e.resourceKey=scripts/smoke/e2e.mjs
sonar.issue.ignore.multicriteria.localPathScreenshot.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.localPathScreenshot.resourceKey=scripts/generate/generate-dashboard-screenshot.mjs
sonar.issue.ignore.multicriteria.localPathStorybook.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.localPathStorybook.resourceKey=scripts/smoke/test-storybook.mjs
sonar.issue.ignore.multicriteria.localPathSmoke.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.localPathSmoke.resourceKey=tools/smoke-app.mjs

# The provider-backed location picker is an ARIA 1.2 editable combobox with
# grouped, rich suggestions and keyboard active-descendant handling. A native
# select/datalist cannot represent its async city metadata or interaction model.
sonar.issue.ignore.multicriteria.asyncLocationCombobox.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.asyncLocationCombobox.resourceKey=components/keywords/LocationField.tsx

# Next.js statically parses middleware matchers and rejects tagged templates;
# this regex must remain a plain string literal even though it needs escaping.
sonar.issue.ignore.multicriteria.nextStaticMatcher.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.nextStaticMatcher.resourceKey=middleware.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Community Build defaults to the built-in Sonar way profiles and quality gate.
# A red gate fails the scan; do not release while it is red.
