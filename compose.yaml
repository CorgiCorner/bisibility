services:
  db-migrations:
    image: ${BISIBILITY_IMAGE:-docker.io/corgicorner/bisibility:0.4.1}
    pull_policy: ${BISIBILITY_PULL_POLICY:-missing}
    command: >
      sh -c 'npm run db:migrate
      && if [ "$$DEMO_FIXED_OTP" = "1" ]; then node --experimental-strip-types prisma/seed.ts; fi'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${BISIBILITY_IMAGE:-docker.io/corgicorner/bisibility:0.4.1}
    pull_policy: ${BISIBILITY_PULL_POLICY:-missing}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    environment: *app-env
    depends_on:
      db-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bisibility
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: bisibility
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisibility -d bisibility"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

volumes:
  postgres-data:
