# Persistent Temporal fallback at localhost:7233 (UI :8233); prefer `npm run temporal:dev`.
# Usage: `docker compose -f docker-compose.temporal.yml up`; full stack: `docker compose --profile scheduled up --build`.
services:
  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - temporal-dev-postgres-data:/var/lib/postgresql/data

  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    user: "0:0"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    volumes:
      - temporal-dev-dynamic-config:/etc/temporal/config/dynamicconfig
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        export SQL_PLUGIN="$$DB"
        export SQL_HOST="$$POSTGRES_SEEDS"
        export SQL_PORT="$$DB_PORT"
        export SQL_USER="$$POSTGRES_USER"
        export SQL_PASSWORD="$$POSTGRES_PWD"
        ensure_database() {
          database="$$1"
          if output=$$(temporal-sql-tool --db "$$database" create 2>&1); then
            printf '%s\n' "$$output"
            return 0
          fi
          if printf '%s\n' "$$output" | grep -qi 'already exists'; then
            printf 'Database %s already exists; applying versioned updates.\n' "$$database"
            return 10
          fi
          printf '%s\n' "$$output" >&2
          return 1
        }
        if ensure_database temporal; then
          temporal-sql-tool --db temporal setup-schema -v 0.0
        elif [ "$$?" -ne 10 ]; then
          exit 1
        fi
        temporal-sql-tool --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        if ensure_database temporal_visibility; then
          temporal-sql-tool --db temporal_visibility setup-schema -v 0.0
        elif [ "$$?" -ne 10 ]; then
          exit 1
        fi
        temporal-sql-tool --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
        printf '{}\n' > /etc/temporal/config/dynamicconfig/docker.yaml

  temporal:
    image: temporalio/server:1.31.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      BIND_ON_IP: 0.0.0.0
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      NUM_HISTORY_SHARDS: "4"
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    volumes:
      - temporal-dev-dynamic-config:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2
    depends_on:
      - temporal
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        timeout 300 sh -c 'until temporal operator cluster health --address temporal:7233 | grep -q SERVING; do echo "Waiting for the Temporal frontend..."; sleep 2; done'
        if temporal operator namespace describe --address temporal:7233 --namespace default >/dev/null 2>&1; then
          temporal operator namespace update --address temporal:7233 --namespace default --retention 24h
        else
          temporal operator namespace create --address temporal:7233 --namespace default --retention 24h --description "bisibility development namespace"
        fi

  temporal-ui:
    image: temporalio/ui:2.49.1
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "127.0.0.1:8233:8080"

volumes:
  temporal-dev-postgres-data:
  temporal-dev-dynamic-config:
